[project]
name = "greentags-lt213a"
version = "0.4.0"
description = "Build and upload tools for the Zephyr nRF51822 OpenDisplay tag"
requires-python = ">=3.11,<3.13"
dependencies = [
  "west>=1.3,<2",
  "pyelftools>=0.31,<1",
  "PyYAML>=6,<7",
  "pykwalify>=1.8,<2",
  "packaging>=24",
  "progress>=1.6,<2",
  "psutil>=6",
  "pylink-square>=1.3",
  "anytree>=2.12,<3",
  "intelhex>=2.3,<3",
  "Pillow>=11,<13",
  "py-opendisplay>=7.14.1,<7.15",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["cryptography>=45,<48"]
