# Upstream Zephyr Host AND Link Layer. No SoftDevice or bootloader.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="OD"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=8
CONFIG_BT_SMP=n
CONFIG_BT_SETTINGS=n
CONFIG_BT_PRIVACY=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n
CONFIG_BT_PHY_UPDATE=n
# nRF51 cleartext DLE support raised the tested Apple peer to ATT MTU 247.
# Keep 27-byte link packets: L2CAP fragmentation avoids large controller pools.
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_DATA_LENGTH_CLEAR=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27
# One connection, no PHY update: bound the local control-procedure pool.
CONFIG_BT_CTLR_LLCP_LOCAL_PROC_CTX_BUF_NUM=4
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_LE_ENC=n
CONFIG_BT_CTLR_CHAN_SEL_2=n
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_COUNT=2
CONFIG_BT_BUF_ACL_TX_COUNT=2
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_ATT_TX_COUNT=1
CONFIG_BT_CONN_TX_MAX=2
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_CTLR_CONN_PARAM_REQ=n
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_RX_STACK_SIZE=1024
# Global O2 authentication needs more stack; spend reclaimed system RAM here.
CONFIG_MAIN_STACK_SIZE=1600
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=128
CONFIG_HEAP_MEM_POOL_SIZE=0
# No time slice is configured or requested by this application/Bluetooth stack.
CONFIG_TIMESLICING=n
CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_SPEED_OPTIMIZATIONS=y
# OpenDisplay uses ordinary HCI, single-attribute reads and a local device name.
CONFIG_BT_HCI_VS=n
CONFIG_BT_ASSERT_VERBOSE=n
CONFIG_BT_GATT_READ_MULTIPLE=n
CONFIG_BT_GATT_READ_MULT_VAR_LEN=n
CONFIG_BT_DEVICE_NAME_GATT_WRITABLE=n
# Only legacy undirected advertising; no directed/extended advertising switch.
CONFIG_BT_CTLR_AD_DATA_BACKUP=n
CONFIG_BT_CTLR_MIN_USED_CHAN=n
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_FLASH=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_GPIO=n
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_AES=y
CONFIG_TINYCRYPT_AES_CMAC=y
CONFIG_TINYCRYPT_AES_CCM=y
CONFIG_MINIMAL_LIBC=y
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_ASSERT=n
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_REBOOT=y
CONFIG_BOOT_BANNER=n
